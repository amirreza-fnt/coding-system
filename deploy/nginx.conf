# Request Coding Service - Reverse Proxy (سرویس متمرکز کد پیگیری — همه سامانه‌ها)
# https://apiweb-requestcoding.sabzevar.ir:5019  ->  Kestrel 127.0.0.1:1519

upstream requestcodingservice {
    server 127.0.0.1:1519;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name apiweb-requestcoding.sabzevar.ir;
    return 301 https://$host:5019$request_uri;
}

server {
    listen 5019 ssl http2;
    listen [::]:5019 ssl http2;
    server_name apiweb-requestcoding.sabzevar.ir;

    ssl_certificate     /etc/letsencrypt/live/apiweb-137request.sabzevar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apiweb-137request.sabzevar.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://requestcodingservice;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
